<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>院餐訂餐系統｜管理後台</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#f3f6f4;
  color:#263238;
}
button,input,select{font:inherit}

/* 登入 */
.login-wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#176b3a,#2d9657);
}
.login-card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:20px;
  padding:38px 32px;
  box-shadow:0 12px 40px rgba(0,0,0,.18);
}
.logo{text-align:center;font-size:42px}
.login-title{
  text-align:center;
  font-size:24px;
  font-weight:800;
  margin:8px 0 4px;
}
.login-sub{
  text-align:center;
  color:#6b7280;
  margin-bottom:28px;
}
.lbl{font-weight:700;margin:14px 0 7px}
.fc{
  width:100%;
  border:1px solid #d6dfda;
  border-radius:12px;
  padding:13px 14px;
  outline:none;
}
.fc:focus{
  border-color:#269253;
  box-shadow:0 0 0 3px rgba(38,146,83,.12);
}
.login-btn{
  width:100%;
  margin-top:22px;
  border:0;
  border-radius:12px;
  padding:14px;
  background:#278f50;
  color:white;
  font-weight:800;
  font-size:17px;
  cursor:pointer;
}
.err{
  color:#c62828;
  text-align:center;
  min-height:24px;
  margin-top:12px;
}

/* 後台 */
.layout{display:none;min-height:100vh}
.sidebar{
  position:fixed;
  left:0;top:0;bottom:0;
  width:230px;
  background:#163d29;
  color:white;
  padding:20px 14px;
}
.sb-title{
  font-size:20px;
  font-weight:800;
  padding:10px 10px 20px;
  border-bottom:1px solid rgba(255,255,255,.15);
}
.sb-user{
  padding:16px 10px;
  font-size:13px;
  color:#d4e7dc;
}
.sb-btn{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  color:white;
  text-align:left;
  padding:12px;
  border-radius:9px;
  margin:4px 0;
  cursor:pointer;
}
.sb-btn:hover,.sb-btn.on{background:#286344}
.logout{
  position:absolute;
  left:14px;right:14px;bottom:18px;
}
.main{margin-left:230px;padding:28px}
.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}
.page-title{font-size:25px;font-weight:800}
.card{
  background:white;
  border-radius:14px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
  margin-bottom:18px;
  overflow:hidden;
}
.card-hd{
  padding:16px 18px;
  font-weight:800;
  border-bottom:1px solid #edf0ee;
}
.card-bd{padding:18px}
.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}
.row .fc{width:auto;min-width:160px}
.btn{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  cursor:pointer;
  font-weight:700;
}
.btn-g{background:#278f50;color:white}
.btn-r{background:#d9534f;color:white}
.btn-o{background:#edf3ef;color:#254c35}
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:18px;
}
.stat{
  background:#fff;
  border-radius:14px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}
.stat-n{font-size:27px;font-weight:800;color:#23864b}
.stat-l{color:#6b7280;font-size:13px;margin-top:5px}
.tbl-wrap{overflow:auto}
table{
  width:100%;
  border-collapse:collapse;
  white-space:nowrap;
}
th,td{
  padding:11px 12px;
  border-bottom:1px solid #edf0ee;
  text-align:left;
  font-size:14px;
}
th{background:#f7faf8}
.no-data{text-align:center;color:#888;padding:30px}
.sec{display:none}
.sec.on{display:block}
.badge{
  display:inline-block;
  padding:4px 9px;
  border-radius:20px;
  background:#e6f5ec;
  color:#176b3a;
  font-size:12px;
}
.toast{
  display:none;
  position:fixed;
  right:20px;
  bottom:20px;
  background:#263238;
  color:#fff;
  padding:12px 18px;
  border-radius:9px;
  z-index:1000;
}

/* 手機 */
@media(max-width:760px){
  .sidebar{
    position:relative;
    width:100%;
    height:auto;
  }
  .layout{display:none;flex-direction:column}
  .main{margin-left:0;padding:15px}
  .logout{position:static;margin-top:15px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .row .fc{width:100%}
}
</style>
</head>

<body>

<!-- 登入 -->
<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <div class="logo">🍱</div>
    <div class="login-title">院餐訂餐系統</div>
    <div class="login-sub">社工室｜管理員專用</div>

    <div class="lbl">員編</div>
    <input id="loginEmp" class="fc"
           placeholder="例：Y00001"
           autocomplete="username"
           oninput="this.value=this.value.toUpperCase()">

    <div class="lbl">密碼</div>
    <input id="loginPwd" class="fc"
           type="password"
           autocomplete="current-password"
           onkeydown="if(event.key==='Enter') login()">

    <button class="login-btn" onclick="login()">登入後台 →</button>

    <div id="loginErr" class="err"></div>
  </div>
</div>


<!-- 管理後台 -->
<div id="layout" class="layout">

  <aside class="sidebar">
    <div class="sb-title">🍱 院餐訂餐系統</div>

    <div id="userInfo" class="sb-user"></div>

    <button class="sb-btn on" onclick="showSec('orders',this)">
      📋 訂餐統計
    </button>

    <button class="sb-btn" onclick="showSec('menu',this)">
      📝 菜單管理
    </button>

    <button class="sb-btn" onclick="showSec('staff',this)">
      🤝 社工室志工名單
    </button>

    <button id="adminBtn" class="sb-btn" onclick="showSec('admins',this)">
      🔐 管理員設定
    </button>

    <div class="logout">
      <button class="sb-btn" onclick="logout()">↩ 登出</button>
    </div>
  </aside>


  <main class="main">

    <div class="top">
      <div id="pageTitle" class="page-title">📋 訂餐統計</div>
      <span class="badge">即時同步</span>
    </div>


    <!-- 訂餐統計 -->
    <section id="sec-orders" class="sec on">

      <div class="card">
        <div class="card-bd row">
          <input id="orderDate" class="fc" type="date" onchange="renderOrders()">
          <button class="btn btn-o" onclick="exportCSV()">⬇ 匯出 CSV</button>
          <button class="btn btn-o" onclick="window.print()">🖨 列印</button>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <div id="stTotal" class="stat-n">0</div>
          <div class="stat-l">訂餐總份數</div>
        </div>

        <div class="stat">
          <div id="stLunch" class="stat-n">0</div>
          <div class="stat-l">午餐</div>
        </div>

        <div class="stat">
          <div id="stDinner" class="stat-n">0</div>
          <div class="stat-l">晚餐</div>
        </div>

        <div class="stat">
          <div id="stPeople" class="stat-n">0</div>
          <div class="stat-l">訂餐筆數</div>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">訂餐明細｜社工室</div>

        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>員編</th>
                <th>姓名</th>
                <th>日期</th>
                <th>餐別</th>
                <th>地點</th>
                <th>主食</th>
                <th>菜名</th>
                <th>飯種</th>
                <th>份數</th>
                <th>狀態</th>
              </tr>
            </thead>
            <tbody id="orderBody"></tbody>
          </table>
        </div>
      </div>

    </section>


    <!-- 菜單 -->
    <section id="sec-menu" class="sec">

      <div class="card">
        <div class="card-hd">新增／修改每日菜單</div>

        <div class="card-bd">
          <div class="row">
            <input id="menuDate" class="fc" type="date">
            <input id="menuLunch1" class="fc" placeholder="午餐主菜一">
            <input id="menuLunch2" class="fc" placeholder="午餐主菜二">
            <input id="menuVeg" class="fc" placeholder="午餐素食">
          </div>

          <div class="row" style="margin-top:12px">
            <input id="menuDinner1" class="fc" placeholder="晚餐主菜一">
            <input id="menuDinner2" class="fc" placeholder="晚餐主菜二">
            <input id="menuDinnerVeg" class="fc" placeholder="晚餐素食">

            <button class="btn btn-g" onclick="saveMenu()">
              儲存菜單
            </button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">已建立菜單</div>

        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>日期</th>
                <th>午餐主菜一</th>
                <th>午餐主菜二</th>
                <th>午餐素食</th>
                <th>晚餐主菜一</th>
                <th>晚餐主菜二</th>
                <th>晚餐素食</th>
              </tr>
            </thead>
            <tbody id="menuBody"></tbody>
          </table>
        </div>
      </div>

    </section>


    <!-- 志工 -->
    <section id="sec-staff" class="sec">

      <div class="card">
        <div class="card-hd">新增社工室志工</div>

        <div class="card-bd">
          <div class="row">
            <input id="staffEmp" class="fc"
                   placeholder="員編"
                   oninput="this.value=this.value.toUpperCase()">

            <input id="staffName" class="fc" placeholder="姓名">

            <button class="btn btn-g" onclick="addStaff()">
              ＋ 新增志工
            </button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">
          社工室志工名單
          <span id="staffCount"></span>
        </div>

        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>員編</th>
                <th>姓名</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="staffBody"></tbody>
          </table>
        </div>
      </div>

    </section>


    <!-- 管理員 -->
    <section id="sec-admins" class="sec">

      <div class="card">
        <div class="card-hd">新增管理員</div>

        <div class="card-bd">
          <div class="row">
            <input id="adminEmp" class="fc"
                   placeholder="員編"
                   oninput="this.value=this.value.toUpperCase()">

            <input id="adminName" class="fc" placeholder="姓名">

            <input id="adminPwd" class="fc"
                   type="password"
                   placeholder="密碼">

            <select id="adminRole" class="fc">
              <option value="social">社工室管理員</option>
              <option value="super">超級管理員</option>
            </select>

            <button class="btn btn-g" onclick="addAdmin()">
              ＋ 新增管理員
            </button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-hd">管理員名冊</div>

        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>員編</th>
                <th>姓名</th>
                <th>權限</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="adminBody"></tbody>
          </table>
        </div>
      </div>

    </section>

  </main>
</div>

<div id="toast" class="toast"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  remove
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCfDx9WW-yJYkKauGDy8QarsQKVWevo2b4",
  authDomain: "volunteer-order.firebaseapp.com",
  projectId: "volunteer-order",
  storageBucket: "volunteer-order.firebasestorage.app",
  messagingSenderId: "437088256984",
  appId: "1:437088256984:web:1d5a55add78bfa8b8228ad",
  databaseURL: "https://volunteer-order-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
  const auth = getAuth(app);

let DB = {
  orders:{},
  menus:{},
  social_staff:{},
  admins:{}
};

let loggedAdmin = null;

const $ = id => document.getElementById(id);

function today(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

$("orderDate").value=today();
$("menuDate").value=today();


/* Firebase 即時同步 */

onValue(ref(db,"orders"),s=>{
  DB.orders=s.val()||{};
  if(loggedAdmin) renderOrders();
});

onValue(ref(db,"menus"),s=>{
  DB.menus=s.val()||{};
  if(loggedAdmin) renderMenus();
});

onValue(ref(db,"social_staff"),s=>{
  DB.social_staff=s.val()||{};
  if(loggedAdmin) renderStaff();
});

onValue(ref(db,"admins"),s=>{
  DB.admins=s.val()||{};
  if(loggedAdmin) renderAdmins();
});


/* 登入 */

 $("adminBtn").style.display="block";

    renderAll();
    toast("登入成功");

  }catch(error){
    console.error(error);

    if(error.code==="auth/invalid-credential"){
      $("loginErr").textContent="帳號或密碼錯誤";
    }else if(error.code==="auth/invalid-email"){
      $("loginErr").textContent="電子郵件格式錯誤";
    }else{
      $("loginErr").textContent="登入失敗："+error.code;
    }
  }
};


window.logout=function(){
  loggedAdmin=null;
  $("layout").style.display="none";
  $("loginScreen").style.display="flex";
  $("loginPwd").value="";
};


/* 分頁 */

window.showSec=function(name,btn){

  document.querySelectorAll(".sec")
    .forEach(x=>x.classList.remove("on"));

  $("sec-"+name).classList.add("on");

  document.querySelectorAll(".sb-btn")
    .forEach(x=>x.classList.remove("on"));

  if(btn) btn.classList.add("on");

  const titles={
    orders:"📋 訂餐統計",
    menu:"📝 菜單管理",
    staff:"🤝 社工室志工名單",
    admins:"🔐 管理員設定"
  };

  $("pageTitle").textContent=titles[name]||"院餐訂餐系統";
};


/* 訂餐 */

window.renderOrders=function(){

  const date=$("orderDate").value;

  let orders=Object.values(DB.orders||{})
    .filter(o=>o && o.date===date);

  /*
    舊資料可能沒有 deptType。
    social 代表社工室。
  */
  const social=orders.filter(o=>
    !o.deptType ||
    o.deptType==="social" ||
    o.department==="社工室" ||
    o.dept==="社工室"
  );

  let total=0,lunch=0,dinner=0;

  social.forEach(o=>{
    const q=Number(o.qty||1);
    total+=q;

    if(o.mealType==="lunch" || o.meal==="午餐") lunch+=q;
    if(o.mealType==="dinner" || o.meal==="晚餐") dinner+=q;
  });

  $("stTotal").textContent=total;
  $("stLunch").textContent=lunch;
  $("stDinner").textContent=dinner;
  $("stPeople").textContent=social.length;

  if(!social.length){
    $("orderBody").innerHTML=
      `<tr><td colspan="10" class="no-data">本日尚無訂餐資料</td></tr>`;
    return;
  }

  $("orderBody").innerHTML=social.map(o=>`

    <tr>
      <td>${esc(o.emp||o.id||"")}</td>
      <td>${esc(o.name||"")}</td>
      <td>${esc(o.date||"")}</td>
      <td>${mealLabel(o)}</td>
      <td>${esc(o.location||o.place||"")}</td>
      <td>${esc(o.dish||o.main||o.mainDish||"")}</td>
      <td>${esc(o.dishName||o.menuName||"")}</td>
      <td>${riceLabel(o.rice)}</td>
      <td>${Number(o.qty||1)}</td>
      <td>${statusLabel(o.status)}</td>
    </tr>

  `).join("");
};


function mealLabel(o){
  if(o.mealType==="lunch") return "午餐";
  if(o.mealType==="dinner") return "晚餐";
  return esc(o.meal||o.mealType||"");
}

function riceLabel(r){
  if(r==="white") return "白飯";
  if(r==="healthy") return "養生飯";
  return esc(r||"");
}

function statusLabel(s){
  if(s==="done") return "已領餐";
  if(s==="cancel") return "已取消";
  if(!s || s==="ordered") return "已訂餐";
  return esc(s);
}


/* CSV */

window.exportCSV=function(){

  const date=$("orderDate").value;

  const orders=Object.values(DB.orders||{})
    .filter(o=>
      o &&
      o.date===date &&
      (
        !o.deptType ||
        o.deptType==="social" ||
        o.department==="社工室" ||
        o.dept==="社工室"
      )
    );

  const rows=[
    ["員編","姓名","日期","餐別","地點","主食","菜名","飯種","份數","狀態"]
  ];

  orders.forEach(o=>{
    rows.push([
      o.emp||o.id||"",
      o.name||"",
      o.date||"",
      mealLabel(o),
      o.location||o.place||"",
      o.dish||o.main||o.mainDish||"",
      o.dishName||o.menuName||"",
      riceLabel(o.rice),
      o.qty||1,
      statusLabel(o.status)
    ]);
  });

  const csv="\ufeff"+rows.map(row=>
    row.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")
  ).join("\n");

  const blob=new Blob([csv],{
    type:"text/csv;charset=utf-8"
  });

  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`社工室訂餐統計_${date}.csv`;
  a.click();

  URL.revokeObjectURL(a.href);
};


/* 菜單 */

window.saveMenu=async function(){

  const date=$("menuDate").value;

  if(!date){
    toast("請選擇日期");
    return;
  }

  const data={
    main1:$("menuLunch1").value.trim(),
    main2:$("menuLunch2").value.trim(),
    veg:$("menuVeg").value.trim(),
    dinnerMain1:$("menuDinner1").value.trim(),
    dinnerMain2:$("menuDinner2").value.trim(),
    dinnerVeg:$("menuDinnerVeg").value.trim()
  };

  try{
    await set(ref(db,"menus/"+date),data);
    toast("菜單已儲存");
  }catch(e){
    toast("儲存失敗："+e.message);
  }
};


function renderMenus(){

  const menus=DB.menus||{};
  const dates=Object.keys(menus).sort().reverse();

  if(!dates.length){
    $("menuBody").innerHTML=
      `<tr><td colspan="7" class="no-data">尚未建立菜單</td></tr>`;
    return;
  }

  $("menuBody").innerHTML=dates.map(date=>{

    const m=menus[date]||{};

    return `
      <tr>
        <td>${esc(date)}</td>
        <td>${esc(m.main1||"")}</td>
        <td>${esc(m.main2||"")}</td>
        <td>${esc(m.veg||"")}</td>
        <td>${esc(m.dinnerMain1||"")}</td>
        <td>${esc(m.dinnerMain2||"")}</td>
        <td>${esc(m.dinnerVeg||"")}</td>
      </tr>
    `;

  }).join("");
}


/* 社工室志工 */

window.addStaff=async function(){

  const emp=$("staffEmp").value.trim().toUpperCase();
  const name=$("staffName").value.trim();

  if(!emp || !name){
    toast("請填寫員編及姓名");
    return;
  }

  if((DB.social_staff||{})[emp]){
    toast("此員編已存在");
    return;
  }

  try{

    await set(ref(db,"social_staff/"+emp),{
      emp,
      name,
      dept:"社工室"
    });

    $("staffEmp").value="";
    $("staffName").value="";

    toast("志工已新增");

  }catch(e){
    toast("新增失敗："+e.message);
  }
};


function renderStaff(){

  const staff=DB.social_staff||{};
  const keys=Object.keys(staff).sort();

  $("staffCount").textContent=`（${keys.length} 人）`;

  if(!keys.length){
    $("staffBody").innerHTML=
      `<tr><td colspan="3" class="no-data">尚無志工資料</td></tr>`;
    return;
  }

  $("staffBody").innerHTML=keys.map(emp=>{

    const s=staff[emp]||{};

    return `
      <tr>
        <td>${esc(s.emp||emp)}</td>
        <td>${esc(s.name||"")}</td>
        <td>
          <button class="btn btn-r"
            onclick="deleteStaff('${js(emp)}')">
            刪除
          </button>
        </td>
      </tr>
    `;

  }).join("");
}


window.deleteStaff=async function(emp){

  if(!confirm(`確定要刪除 ${emp} 嗎？`)) return;

  try{
    await remove(ref(db,"social_staff/"+emp));
    toast("已刪除");
  }catch(e){
    toast("刪除失敗："+e.message);
  }
};


/* 管理員 */

window.addAdmin=async function(){

  if(!loggedAdmin || loggedAdmin.role!=="super"){
    toast("只有超級管理員可以新增管理員");
    return;
  }

  const emp=$("adminEmp").value.trim().toUpperCase();
  const name=$("adminName").value.trim();
  const pwd=$("adminPwd").value;
  const role=$("adminRole").value;

  if(!emp || !name || !pwd){
    toast("請填寫完整資料");
    return;
  }

  if((DB.admins||{})[emp]){
    toast("此員編已存在");
    return;
  }

  try{

    await set(ref(db,"admins/"+emp),{
      emp,
      name,
      pwd,
      role,
      dept:"社工室"
    });

    $("adminEmp").value="";
    $("adminName").value="";
    $("adminPwd").value="";

    toast("管理員已新增");

  }catch(e){
    toast("新增失敗："+e.message);
  }
};


function renderAdmins(){

  if(!loggedAdmin || loggedAdmin.role!=="super") return;

  const admins=DB.admins||{};
  const keys=Object.keys(admins).sort();

  if(!keys.length){
    $("adminBody").innerHTML=
      `<tr><td colspan="4" class="no-data">尚無管理員</td></tr>`;
    return;
  }

  $("adminBody").innerHTML=keys.map(emp=>{

    const a=admins[emp]||{};

    return `
      <tr>
        <td>${esc(a.emp||emp)}</td>
        <td>${esc(a.name||"")}</td>
        <td>
          ${a.role==="super"?"超級管理員":"社工室管理員"}
        </td>
        <td>
          ${
            emp===loggedAdmin.emp
            ? "目前登入"
            : `<button class="btn btn-r"
                 onclick="deleteAdmin('${js(emp)}')">
                 刪除
               </button>`
          }
        </td>
      </tr>
    `;

  }).join("");
}


window.deleteAdmin=async function(emp){

  if(!loggedAdmin || loggedAdmin.role!=="super") return;

  if(!confirm(`確定刪除管理員 ${emp}？`)) return;

  try{
    await remove(ref(db,"admins/"+emp));
    toast("管理員已刪除");
  }catch(e){
    toast("刪除失敗："+e.message);
  }
};


/* 共用 */

function renderAll(){
  renderOrders();
  renderMenus();
  renderStaff();
  renderAdmins();
}

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

function js(v){
  return String(v??"")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");
}

function toast(msg){

  const t=$("toast");

  t.textContent=msg;
  t.style.display="block";

  clearTimeout(window.__toastTimer);

  window.__toastTimer=setTimeout(()=>{
    t.style.display="none";
  },2500);
}

</script>
