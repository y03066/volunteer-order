<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社工室訂餐後台</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans TC',sans-serif;background:#f6f8fb;color:#263238}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:16px}.login .card{width:390px;padding:28px}.fc{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:15px}.lbl{font-weight:700;margin:12px 0 6px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#166534;color:#fff}.danger{background:#fee2e2;color:#991b1b}.light{background:#eef2f7}.full{width:100%;margin-top:14px}.err{color:#b91c1c;margin-top:8px}.app{display:none}.side{position:fixed;left:0;top:0;bottom:0;width:220px;background:#163b2b;color:#fff;padding:18px}.brand{font-size:19px;font-weight:800;margin-bottom:20px}.nav{width:100%;border:0;background:transparent;color:#d1fae5;padding:12px;text-align:left;border-radius:8px;margin:3px 0;cursor:pointer}.nav.on,.nav:hover{background:#ffffff18;color:#fff}.main{margin-left:220px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:16px}.stat b{font-size:28px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.grow{flex:1;min-width:180px}.sec{display:none}.sec.on{display:block}.tblwrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;white-space:nowrap}.muted{color:#64748b}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:9px;display:none}@media(max-width:760px){.side{position:static;width:auto}.main{margin:0}.app{display:none}.grid{grid-template-columns:1fr 1fr}.nav{display:inline-block;width:auto}.top{align-items:flex-start;gap:8px}}</style></head><body>
<div id="login" class="login"><div class="card"><h1>🤝 社工室志工訂餐系統</h1><div class="muted">管理員後台</div><div class="lbl">管理員員編</div><input id="emp" class="fc" placeholder="例：Y03066" oninput="this.value=this.value.toUpperCase()"><div class="lbl">密碼</div><input id="pwd" type="password" class="fc" onkeydown="if(event.key==='Enter')login()"><div id="loginErr" class="err"></div><button class="btn primary full" onclick="login()">登入後台</button></div></div>
<div id="app" class="app"><aside class="side"><div class="brand">🤝 社工室訂餐後台</div><button class="nav on" onclick="showSec('orders',this)">📋 訂餐統計</button><button class="nav" onclick="showSec('menu',this)">📝 菜單管理</button><button class="nav" onclick="showSec('staff',this)">👥 志工名單</button><button class="nav" onclick="logout()">↩️ 登出</button></aside><main class="main"><div class="top"><h2 id="title">📋 訂餐統計</h2><div><a href="01-order.html">前往訂餐</a>　<a href="02-pickup.html">取餐</a></div></div>
<section id="orders" class="sec on"><div class="card"><div class="row"><div><div class="lbl">查詢日期</div><input id="orderDate" type="date" class="fc" onchange="renderOrders()"></div><button class="btn light" onclick="exportCSV()">📥 匯出 CSV</button><button class="btn light" onclick="window.print()">🖨️ 列印</button></div></div><div class="grid"><div class="stat">總份數<br><b id="stTotal">0</b></div><div class="stat">已領取<br><b id="stDone">0</b></div><div class="stat">未領取<br><b id="stPending">0</b></div><div class="stat">訂餐人數<br><b id="stPeople">0</b></div></div><div class="card"><h3>訂單明細</h3><div class="tblwrap"><table><thead><tr><th>姓名</th><th>日期</th><th>菜名</th><th>飯種</th><th>份數</th><th>狀態</th><th>操作</th></tr></thead><tbody id="orderBody"></tbody></table></div></div></section>
<section id="menu" class="sec"><div class="card"><h3>建立／修改菜單</h3><div class="row"><div><div class="lbl">日期</div><input id="menuDate" type="date" class="fc"></div><div class="grow"><div class="lbl">主菜一</div><input id="m1" class="fc"></div><div class="grow"><div class="lbl">主菜二</div><input id="m2" class="fc"></div><div class="grow"><div class="lbl">素食</div><input id="veg" class="fc"></div><button class="btn primary" onclick="saveMenu()">儲存菜單</button></div></div><div class="card"><h3>菜單列表</h3><div class="tblwrap"><table><thead><tr><th>日期</th><th>主菜一</th><th>主菜二</th><th>素食</th><th>操作</th></tr></thead><tbody id="menuBody"></tbody></table></div></div></section>
<section id="staff" class="sec"><div class="card"><h3>新增社工室志工</h3><div class="row"><div class="grow"><div class="lbl">姓名</div><input id="staffName" class="fc" placeholder="例：王小明"></div><div class="grow"><div class="lbl">備註</div><input id="staffNote" class="fc" placeholder="例：週一上午"></div><button class="btn primary" onclick="addStaff()">新增志工</button></div></div><div class="card"><h3>社工室志工名單 <span id="staffCount" class="muted"></span></h3><div class="tblwrap"><table><thead><tr><th>姓名</th><th>備註</th><th>操作</th></tr></thead><tbody id="staffBody"></tbody></table></div></div></section>
</main></div><div id="toast" class="toast"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getDatabase,ref,onValue,set,remove,update}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
const cfg={apiKey:'AIzaSyCfDx9WW-yJYkKauGDv80arsOKVWeyo2b4',authDomain:'volunteer-order.firebaseapp.com',databaseURL:'https://volunteer-order-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'volunteer-order',storageBucket:'volunteer-order.firebasestorage.app',messagingSenderId:'437088256984',appId:'1:437088256984:web:1d5a55add78bfa8b8228ad'};const app=initializeApp(cfg),db=getDatabase(app),auth=getAuth(app),$=i=>document.getElementById(i);let DB={orders:{},menus:{},social_staff:{}};const today=()=>new Date().toLocaleDateString('en-CA');$('orderDate').value=today();$('menuDate').value=today();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
onValue(ref(db,'orders'),s=>{DB.orders=s.val()||{};renderOrders()});onValue(ref(db,'menus'),s=>{DB.menus=s.val()||{};renderMenus()});onValue(ref(db,'social_staff'),s=>{DB.social_staff=s.val()||{};renderStaff()});
window.login=async()=>{const raw=$('emp').value.trim(),pwd=$('pwd').value;$('loginErr').textContent='';if(!raw||!pwd){$('loginErr').textContent='請輸入員編及密碼';return}const email=raw.includes('@')?raw.toLowerCase():raw.toLowerCase()+'@ms1.ylh.gov.tw';try{await signInWithEmailAndPassword(auth,email,pwd)}catch(e){console.error(e);$('loginErr').textContent=(e.code==='auth/invalid-credential'||e.code==='auth/user-not-found'||e.code==='auth/wrong-password')?'帳號或密碼錯誤':'登入失敗：'+e.code}};
onAuthStateChanged(auth,u=>{if(u){$('login').style.display='none';$('app').style.display='block';renderOrders();renderMenus();renderStaff()}else{$('app').style.display='none';$('login').style.display='flex'}});window.logout=()=>signOut(auth);
window.showSec=(n,b)=>{document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));$(n).classList.add('on');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');$('title').textContent={orders:'📋 訂餐統計',menu:'📝 菜單管理',staff:'👥 志工名單'}[n]};
function socialOrders(date){return Object.values(DB.orders).filter(o=>o&&o.date===date&&o.deptType==='social'&&o.status!=='cancel')}
window.renderOrders=()=>{if(!$('orderBody'))return;const a=socialOrders($('orderDate').value),total=a.reduce((s,o)=>s+Number(o.qty||1),0),done=a.filter(o=>o.status==='done').reduce((s,o)=>s+Number(o.qty||1),0);$('stTotal').textContent=total;$('stDone').textContent=done;$('stPending').textContent=total-done;$('stPeople').textContent=new Set(a.map(o=>o.volunteerId||o.name)).size;$('orderBody').innerHTML=a.length?a.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.date)}</td><td>${esc(o.dishName)}</td><td>${o.rice==='health'?'養生飯':'白飯'}</td><td>${o.qty||1}</td><td>${o.status==='done'?'已領取':'未領取'}</td><td><button class="btn light" onclick="toggleDone('${o.id}','${o.status}')">${o.status==='done'?'改為未領':'標記已領'}</button> <button class="btn danger" onclick="deleteOrder('${o.id}')">刪除</button></td></tr>`).join(''):'<tr><td colspan="7" class="muted">本日尚無訂餐資料</td></tr>'};
window.toggleDone=(id,s)=>update(ref(db,'orders/'+id),{status:s==='done'?'pending':'done'});window.deleteOrder=async id=>{if(confirm('確定刪除這筆訂單？'))await remove(ref(db,'orders/'+id))};
window.exportCSV=()=>{const d=$('orderDate').value,a=socialOrders(d),rows=[['姓名','日期','菜名','飯種','份數','狀態'],...a.map(o=>[o.name,o.date,o.dishName,o.rice==='health'?'養生飯':'白飯',o.qty||1,o.status==='done'?'已領取':'未領取'])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),ael=document.createElement('a');ael.href=URL.createObjectURL(blob);ael.download=`社工室訂餐統計_${d}.csv`;ael.click();URL.revokeObjectURL(ael.href)};
window.saveMenu=async()=>{const d=$('menuDate').value;if(!d){toast('請選日期');return}await set(ref(db,'menus/'+d),{main1:$('m1').value.trim(),main2:$('m2').value.trim(),veg:$('veg').value.trim()});toast('菜單已儲存')};function renderMenus(){if(!$('menuBody'))return;const ks=Object.keys(DB.menus).sort().reverse();$('menuBody').innerHTML=ks.length?ks.map(d=>{const m=DB.menus[d]||{};return`<tr><td>${d}</td><td>${esc(m.main1)}</td><td>${esc(m.main2)}</td><td>${esc(m.veg)}</td><td><button class="btn light" onclick="editMenu('${d}')">編輯</button> <button class="btn danger" onclick="deleteMenu('${d}')">刪除</button></td></tr>`}).join(''):'<tr><td colspan="5" class="muted">尚無菜單</td></tr>'}window.editMenu=d=>{const m=DB.menus[d]||{};$('menuDate').value=d;$('m1').value=m.main1||'';$('m2').value=m.main2||'';$('veg').value=m.veg||'';showSec('menu',document.querySelectorAll('.nav')[1])};window.deleteMenu=async d=>{if(confirm('確定刪除此日期菜單？'))await remove(ref(db,'menus/'+d))};
function makeKey(){return 'v'+Date.now()+Math.random().toString(36).slice(2,6)}window.addStaff=async()=>{const n=$('staffName').value.trim(),note=$('staffNote').value.trim();if(!n){toast('請輸入姓名');return}if(Object.values(DB.social_staff).some(v=>String(v.name||'').trim()===n)){toast('此姓名已存在');return}await set(ref(db,'social_staff/'+makeKey()),{name:n,note,dept:'社工室'});$('staffName').value='';$('staffNote').value='';toast('志工已新增')};function renderStaff(){if(!$('staffBody'))return;const a=Object.entries(DB.social_staff);$('staffCount').textContent=`（${a.length} 人）`;$('staffBody').innerHTML=a.length?a.sort((x,y)=>String(x[1].name).localeCompare(String(y[1].name),'zh-Hant')).map(([k,v])=>`<tr><td>${esc(v.name)}</td><td>${esc(v.note||'')}</td><td><button class="btn danger" onclick="deleteStaff('${k}')">刪除</button></td></tr>`).join(''):'<tr><td colspan="3" class="muted">尚無志工資料</td></tr>'}window.deleteStaff=async k=>{if(confirm('確定刪除此志工？'))await remove(ref(db,'social_staff/'+k))};
</script></body></html>
