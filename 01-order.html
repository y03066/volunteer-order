<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社工室志工訂餐</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans TC',sans-serif;background:#f6f8fb;color:#263238}.wrap{max-width:560px;margin:auto;min-height:100vh;background:white;padding:24px}.head{background:#166534;color:white;margin:-24px -24px 24px;padding:22px 24px}.head h1{margin:0 0 6px;font-size:24px}.card{border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0}.label{font-weight:700;margin:10px 0 6px}.fc{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.btn{border:0;border-radius:9px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:#166534;color:white;width:100%}.primary:disabled{background:#94a3b8;cursor:not-allowed}.light{background:#eef2f7}.meal{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:34px;height:34px;border:0;border-radius:8px;font-size:20px}.muted{color:#64748b;font-size:14px}.ok{background:#ecfdf5;color:#166534;padding:12px;border-radius:9px}.err{color:#b91c1c;margin:8px 0}.deadline{background:#fff7ed;color:#9a3412;padding:10px;border-radius:9px;margin:10px 0}.hide{display:none}</style></head><body><div class="wrap"><div class="head"><h1>🍱 社工室志工訂餐系統</h1><div>僅供社工室志工使用</div></div>
<div id="login" class="card"><h2>志工登入</h2><div class="label">姓名</div><input id="name" class="fc" placeholder="請輸入志工姓名"><div id="loginErr" class="err"></div><button class="btn primary" onclick="login()">登入</button><p class="muted">姓名需已建立於社工室志工名單。</p></div>
<div id="app" class="hide"><div class="card"><b id="hello"></b><div id="campusText" class="muted" style="margin-top:5px"></div><button class="btn light" style="float:right;margin-top:-32px" onclick="logout()">登出</button><div style="clear:both"></div></div>
<div class="card"><h2>訂餐</h2><div class="label">日期</div><select id="date" class="fc" onchange="renderMenu()"></select><div id="deadlineInfo"></div><div id="menuArea"></div><div id="msg" class="err"></div><button id="submitBtn" class="btn primary" onclick="submitOrder()">送出訂餐</button></div>
<div class="card"><h2>我的訂單</h2><div id="myOrders" class="muted">尚無訂單</div></div></div></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getDatabase,ref,onValue,update}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyCfDx9WW-yJYkKauGDv80arsOKVWeyo2b4',authDomain:'volunteer-order.firebaseapp.com',databaseURL:'https://volunteer-order-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'volunteer-order',storageBucket:'volunteer-order.firebasestorage.app',messagingSenderId:'437088256984',appId:'1:437088256984:web:1d5a55add78bfa8b8228ad'};
const db=getDatabase(initializeApp(firebaseConfig));const $=id=>document.getElementById(id);let DB={menus:{},orders:{},social_staff:{}},user=null,cart={};
onValue(ref(db,'menus'),s=>{DB.menus=s.val()||{};fillDates();});onValue(ref(db,'orders'),s=>{DB.orders=s.val()||{};renderMine();});onValue(ref(db,'social_staff'),s=>{DB.social_staff=s.val()||{};});
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function today(){return new Date().toLocaleDateString('en-CA')}function campusName(c){return c==='huwei'?'虎尾院區':'斗六院區'}function deadlineTs(m){if(!m?.deadlineDate||!m?.deadlineTime)return null;return new Date(`${m.deadlineDate}T${m.deadlineTime}:00+08:00`).getTime()}function isClosed(m){const t=deadlineTs(m);return t!==null&&Date.now()>=t}
window.login=()=>{const n=$('name').value.trim();const found=Object.entries(DB.social_staff).find(([,v])=>String(v.name||'').trim()===n);if(!n){$('loginErr').textContent='請輸入姓名';return}if(!found){$('loginErr').textContent='志工名單中查無此姓名，請洽社工室';return}user={id:found[0],name:found[1].name,campus:found[1].campus||'douliou'};$('hello').textContent=`👋 ${user.name} 您好`;$('campusText').textContent=`所屬院區：${campusName(user.campus)}`;$('login').classList.add('hide');$('app').classList.remove('hide');fillDates();renderMine()};
window.logout=()=>{user=null;cart={};$('app').classList.add('hide');$('login').classList.remove('hide');$('name').value=''};
function fillDates(){if(!$('date'))return;const cur=$('date').value;const ds=Object.keys(DB.menus).sort().filter(d=>d>=today()&&!DB.menus[d]?.holiday);$('date').innerHTML='<option value="">請選擇日期</option>'+ds.map(d=>{const closed=isClosed(DB.menus[d]);return`<option value="${d}" ${d===cur?'selected':''} ${closed?'disabled':''}>${d}${closed?'（已截止）':''}</option>`}).join('');if(!$('date').value){const o=[...$('date').options].find(x=>x.value&&!x.disabled);if(o){o.selected=true;renderMenu()}else{renderMenu()}}}
window.renderMenu=()=>{cart={};$('msg').textContent='';$('msg').className='err';const d=$('date').value,m=DB.menus[d];if(!m){$('menuArea').innerHTML='<p class="muted">目前沒有可訂餐的日期</p>';$('deadlineInfo').innerHTML='';$('submitBtn').disabled=true;return}const closed=isClosed(m);$('deadlineInfo').innerHTML=m.deadlineDate&&m.deadlineTime?`<div class="deadline">${closed?'🔒 本日訂餐已截止':'⏰ 訂餐截止：'} ${esc(m.deadlineDate)} ${esc(m.deadlineTime)}</div>`:'<div class="muted" style="margin:10px 0">本日未設定訂餐截止時間</div>';$('submitBtn').disabled=closed;if(closed){$('menuArea').innerHTML='<p class="muted">此供餐日期已停止接受訂餐。</p>';return}const dishes=[['main1',m.main1],['main2',m.main2],['veg',m.veg]].filter(x=>x[1]);$('menuArea').innerHTML=dishes.flatMap(([k,n])=>[['white','白飯'],['health','養生飯']].map(([r,rn])=>`<div class="meal"><div><b>${esc(n)}</b><div class="muted">${rn}</div></div><div class="qty"><button onclick="chg('${k}','${r}',-1)">−</button><b id="q-${k}-${r}">0</b><button onclick="chg('${k}','${r}',1)">＋</button></div></div>`)).join('')};
window.chg=(dish,rice,delta)=>{const k=dish+'-'+rice;cart[k]=Math.max(0,(cart[k]||0)+delta);$('q-'+k).textContent=cart[k]};
window.submitOrder=async()=>{if(!user)return;const date=$('date').value,m=DB.menus[date];if(!date||!m){$('msg').textContent='請選擇日期';return}if(isClosed(m)){$('msg').className='err';$('msg').textContent='此日期已超過訂餐截止時間，無法送出訂單';renderMenu();return}const picks=Object.entries(cart).filter(([,q])=>q>0);if(!picks.length){$('msg').textContent='請至少選擇一份餐點';return}const u={};for(const[k,qty]of picks){const[dish,rice]=k.split('-'),id='o'+Date.now()+Math.random().toString(36).slice(2,7);u['orders/'+id]={id,volunteerId:user.id,emp:user.id,name:user.name,dept:'社工室',deptType:'social',date,mealType:'lunch',loc:user.campus||'douliou',dish,dishName:m[dish]||dish,rice,qty,status:'pending',ts:Date.now()}}try{await update(ref(db),u);$('msg').className='ok';$('msg').textContent='訂餐成功！';cart={};renderMenu()}catch(e){$('msg').className='err';$('msg').textContent='送出失敗：'+e.message}};
function renderMine(){if(!user||!$('myOrders'))return;const a=Object.values(DB.orders).filter(o=>o&&o.volunteerId===user.id&&o.date>=today()&&o.status!=='cancel').sort((a,b)=>a.date.localeCompare(b.date));$('myOrders').innerHTML=a.length?a.map(o=>`<div class="meal"><div><b>${esc(o.date)}｜${esc(o.dishName)}</b><div class="muted">${campusName(o.loc)}・${o.rice==='health'?'養生飯':'白飯'}・${o.qty}份</div></div><span>${o.status==='done'?'✅ 已領':'⏳ 未領'}</span></div>`).join(''):'尚無訂單'}
</script></body></html>
