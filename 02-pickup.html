<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社工室志工取餐</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans TC',sans-serif;background:#f6f8fb;color:#263238}.wrap{max-width:900px;margin:auto;padding:24px}.head{background:#166534;color:#fff;padding:20px;border-radius:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-top:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.fc{padding:11px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;background:#166534;color:#fff}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid #eee;padding:14px 0}.done{opacity:.55}.muted{color:#64748b}</style></head><body><div class="wrap"><div class="head"><h1>🧺 社工室志工取餐</h1><div>依姓名查詢當日訂單並確認領取</div></div><div class="card"><div class="row"><input id="date" type="date" class="fc"><input id="name" class="fc" placeholder="輸入志工姓名"><button class="btn" onclick="render()">查詢</button></div><div id="list" class="muted" style="margin-top:14px">請輸入姓名查詢</div></div></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';import{getDatabase,ref,onValue,update}from'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';const c={apiKey:'AIzaSyCfDx9WW-yJYkKauGDy8QarsQKVWevo2b4',authDomain:'volunteer-order.firebaseapp.com',databaseURL:'https://volunteer-order-default-rtdb.asia-southeast1.firebasedatabase.app',projectId:'volunteer-order',storageBucket:'volunteer-order.firebasestorage.app',messagingSenderId:'437088256984',appId:'1:437088256984:web:1d5a55add78bfa8b8228ad'};const db=getDatabase(initializeApp(c));const $=i=>document.getElementById(i);let orders={};$('date').value=new Date().toLocaleDateString('en-CA');onValue(ref(db,'orders'),s=>{orders=s.val()||{};if($('name').value.trim())render()});function e(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.render=()=>{const d=$('date').value,n=$('name').value.trim();const a=Object.values(orders).filter(o=>o&&o.date===d&&o.name===n&&o.deptType==='social'&&o.status!=='cancel');$('list').innerHTML=a.length?a.map(o=>`<div class="item ${o.status==='done'?'done':''}"><div><b>${e(o.dishName)}</b>＋${o.rice==='health'?'養生飯':'白飯'}<div class="muted">${o.qty} 份</div></div><button class="btn" ${o.status==='done'?'disabled':''} onclick="pickup('${o.id}')">${o.status==='done'?'已領取':'確認領取'}</button></div>`).join(''):'查無當日訂單'};window.pickup=async id=>{await update(ref(db,'orders/'+id),{status:'done',pickupTs:Date.now()});render()};
</script></body></html>
